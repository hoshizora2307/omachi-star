<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お知らせ | 大町温泉郷 星空観賞会 ～銀河の旅人～</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(6, 10, 23, 0.95);
            --text-main: #f0f8ff;
            --accent-gold: #e6c27a;
            --accent-glow: rgba(230, 194, 122, 0.4);
            --card-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            background-color: #060a17;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, rgba(15, 23, 42, 1) 0%, rgba(6, 10, 23, 1) 100%);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 92px;
            background: rgba(6, 10, 23, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(230, 194, 122, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            color: var(--accent-gold);
            font-size: 1.8rem;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-text span {
            color: var(--accent-gold);
            font-size: 0.85rem;
            display: block;
            letter-spacing: 2px;
        }

        .back-to-home {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-to-home:hover {
            color: var(--accent-gold);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 150px 20px 100px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-title h1 {
            font-size: 3rem;
            color: var(--accent-gold);
            letter-spacing: 6px;
            text-shadow: 0 0 15px var(--accent-glow);
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        .page-title p {
            font-size: 1rem;
            color: #bbb;
            letter-spacing: 4px;
            margin-top: 10px;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .news-article {
            background: var(--card-bg);
            border: 1px solid rgba(230, 194, 122, 0.2);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .news-article:hover {
            transform: translateY(-3px);
            border-color: rgba(230, 194, 122, 0.6);
        }

        .news-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .news-date {
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Zen Maru Gothic', sans-serif;
            letter-spacing: 1px;
        }

        .news-category {
            background: rgba(230, 194, 122, 0.15);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(230, 194, 122, 0.3);
            letter-spacing: 1px;
        }

        .news-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.4;
            font-family: 'Kiwi Maru', serif;
        }

        .news-content {
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            background: rgba(6, 10, 23, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-credit {
            font-size: 0.85rem;
            color: #718096;
            letter-spacing: 1px;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; text-shadow: 0 0 15px var(--accent-gold); } }

        @media (max-width: 768px) {
            header { padding: 0 20px; height: 82px; }
            .logo { font-size: 1.1rem; }
            .logo-icon { font-size: 1.4rem; }
            .container { padding: 120px 15px 80px 15px; }
            .page-title h1 { font-size: 2.2rem; }
            .news-article { padding: 20px; }
            .news-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <div class="logo-icon">✦</div>
            <div class="logo-text">
                <span>大町温泉郷</span>
                <span style="font-size:1.4rem; color:#fff; font-weight:bold; letter-spacing:0;">星空観賞会</span>
            </div>
        </a>
        <a href="index.html" class="back-to-home">
            <span>◀</span> TOPへ戻る
        </a>
    </header>

    <main class="container">
        <div class="page-title">
            <h1>NEWS</h1>
            <p>お知らせ</p>
        </div>

        <div class="news-list" id="news-container">
        </div>
    </main>

    <footer>
        <div class="footer-credit">&copy; 株式会社MONDOCOLO. All rights reserved.</div>
    </footer>

    <script src="newsData.js?ver=1.0"></script>
    <script>
        function renderNews() {
            const container = document.getElementById('news-container');
            
            if (!container || typeof newsData === 'undefined') {
                return;
            }
            
            newsData.forEach(news => {
                const articleEl = document.createElement('article');
                articleEl.className = 'news-article';
                
                articleEl.innerHTML = `
                    <div class="news-meta">
                        <span class="news-date">${news.date}</span>
                        <span class="news-category">${news.category}</span>
                    </div>
                    <h2 class="news-title">${news.title}</h2>
                    <div class="news-content">${news.content}</div>
                `;
                
                container.appendChild(articleEl);
            });
        }

        document.addEventListener('DOMContentLoaded', renderNews);
    </script>
</body>
</html>
