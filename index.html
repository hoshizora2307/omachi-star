<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大町温泉郷 星空観賞会 ～銀河の旅人～</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(6, 10, 23, 0.75);
            --text-main: #f0f8ff;
            --accent-gold: #e6c27a;
            --accent-glow: rgba(230, 194, 122, 0.4);
            --card-bg: rgba(15, 23, 42, 0.6);
            --accent-pink: #ff7495;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            background-color: #060a17;
            overflow-x: hidden;
        }

        body.no-scroll {
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, transparent 20%, var(--bg-overlay) 80%);
            z-index: -1;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            z-index: 1000;
            transition: all 0.4s ease;
        }

        header.scrolled {
            height: 65px;
            background: rgba(6, 10, 23, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(230, 194, 122, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            color: var(--accent-gold);
            font-size: 1.8rem;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-text span {
            color: var(--accent-gold);
            font-size: 0.85rem;
            display: block;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 35px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            position: relative;
            padding: 5px 0;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: width 0.3s;
        }
        nav a:hover::after, nav a.active::after {
            width: 100%;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #bbb;
            animation: fadeIn 2s ease-out;
        }

        .hero h1 {
            font-size: 4rem;
            margin: 20px 0 30px 0;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(255,255,255,0.2);
            animation: fadeIn 2.5s ease-out;
        }

        .launch-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-gold);
            letter-spacing: 6px;
            text-shadow: 0 0 10px var(--accent-glow);
            animation: fadeIn 3s ease-out;
            border: 1px solid var(--accent-gold);
            padding: 10px 30px;
            background: rgba(6, 10, 23, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .launch-text:hover {
            background: rgba(230, 194, 122, 0.2);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.03);
        }

        .sec-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 50px;
            color: var(--accent-gold);
            letter-spacing: 4px;
            position: relative;
        }

        .partner-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .partner-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .partner-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 54px;
            height: 54px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--accent-gold);
            border-radius: 50%;
            color: var(--accent-gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 999;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .to-top .star-icon {
            font-size: 1.2rem;
            line-height: 1;
            margin-bottom: -2px;
        }

        .to-top .to-top-text {
            font-size: 0.65rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .to-top:hover {
            background: var(--accent-gold);
            color: #060a17;
            box-shadow: 0 0 20px var(--accent-gold);
            transform: translateY(-4px);
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            background: rgba(6, 10, 23, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 100px;
        }

        .footer-info {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .footer-info span {
            display: inline-block;
            margin: 0 12px;
        }

        .footer-credit {
            font-size: 0.85rem;
            color: #718096;
            letter-spacing: 1px;
            white-space: normal;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }

        .cinema-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            overflow: hidden;
        }

        .cinema-page.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cinema-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2001;
        }

        .cinema-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.7) 100%);
            z-index: 2002;
        }

        .cinema-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2003;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cinema-text-box {
            position: absolute;
            width: 90%;
            max-width: 680px;
            text-align: center;
            top: 100%;
            transform: translateY(0);
        }

        .cinema-page.active .cinema-text-box {
            animation: movieScroll 22s linear forwards;
        }

        .cinema-text-box p {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1.9rem;
            line-height: 2.4;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255,255,255,0.4), 0 0 20px rgba(230,194,122,0.2);
            font-weight: 500;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .love-highlight {
            color: var(--accent-pink);
            font-weight: 700;
            text-shadow: 0 0 12px rgba(255, 116, 149, 0.6);
        }

        .btn-home-back {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2004;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(230, 194, 122, 0.6);
            padding: 12px 28px;
            color: var(--accent-gold);
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .cinema-page.active .btn-home-back {
            animation: fadeInButton 3s ease forwards;
            animation-delay: 2s;
        }

        .btn-home-back:hover {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px var(--accent-gold);
        }

        @keyframes movieScroll {
            0% { top: 100%; transform: translateY(0); }
            100% { top: -50%; transform: translateY(0); }
        }

        @keyframes fadeInButton {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; text-shadow: 0 0 15px var(--accent-gold); } }

        @keyframes fadeInTopButton { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 768px) {
            header { padding: 0 20px; height: 65px; }
            .logo { font-size: 1.1rem; gap: 8px; }
            .logo-icon { font-size: 1.4rem; }
            .logo-text span { font-size: 0.75rem; letter-spacing: 1px; }
            nav ul { gap: 15px; }
            nav a { font-size: 0.85rem; }
            
            .container { padding: 60px 15px; }
            .hero h1 { font-size: 2.5rem; letter-spacing: 4px; word-break: keep-all; overflow-wrap: anywhere; margin: 15px 0 25px 0; }
            .hero p { font-size: 1rem; letter-spacing: 2px; padding: 0 10px; }
            .launch-text { font-size: 1.3rem; letter-spacing: 4px; padding: 8px 20px; }
            .sec-title { font-size: 1.8rem; margin-bottom: 30px; }
            
            .partner-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .partner-card { padding: 15px 10px; min-height: 75px; font-size: 0.9rem; }
            
            .to-top { bottom: 20px; right: 20px; width: 46px; height: 46px; }
            .to-top .star-icon { font-size: 1rem; }
            .to-top .to-top-text { font-size: 0.55rem; }

            .footer-info span { display: block; margin: 6px 0; }
            .footer-credit { font-size: 0.75rem; letter-spacing: 0.5px; padding: 0 10px; }

            .cinema-text-box p {
                font-size: 1.35rem;
                line-height: 2.5;
                letter-spacing: 3px;
                padding: 0 10px;
            }
            @keyframes movieScroll {
                0% { top: 100%; }
                100% { top: -65%; }
            }
            .btn-home-back { padding: 10px 22px; font-size: 0.85rem; bottom: 30px; }
        }

        @media (max-width: 480px) {
            .partner-grid { grid-template-columns: 1fr; }
            nav ul { gap: 10px; }
            nav a { font-size: 0.8rem; }
            .footer-info { font-size: 0.75rem; }
            .footer-credit { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop muted playsinline id="bg-video-main">
        <source src="5963.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <header id="main-header">
        <a href="#" class="logo">
            <div class="logo-icon">✦</div>
            <div class="logo-text">
                <span>大町温泉郷</span>
                星空観賞会
            </div>
        </a>
        <nav>
            <ul>
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#partners" class="nav-link">Partners</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">
        <div id="home" class="hero">
            <p>星空案内ツアーガイド最高峰の体験</p>
            <h1>銀河の旅人</h1>
            <div class="launch-text" id="btn-launch">2026年8月始動</div>
        </div>

        <div class="container">
            <section id="partners" class="fade-in-up">
                <h2 class="sec-title">PARTNERS</h2>
                <div class="partner-grid">
                    <div class="partner-card">緑翠亭 景水</div>
                    <div class="partner-card">薬師の湯</div>
                    <div class="partner-card">ねるだけ</div>
                    <div class="partner-card">大町温泉郷観光協会</div>
                </div>
            </section>
        </div>

        <footer>
            <div class="footer-info">
                <span>株式会社MONDOCOLO</span>
                <span>〒398-0002 長野県大町市大町俵町１９０３−１</span>
                <span>TEL: 0261-85-0131</span>
            </div>
            <div class="footer-credit">&copy; 株式会社MONDOCOLO. All rights reserved.</div>
        </footer>
    </div>

    <a href="#" id="to-top" class="to-top">
        <span class="star-icon">✦</span>
        <span class="to-top-text">TOP</span>
    </a>


    <div id="cinema-layer" class="cinema-page">
        <video class="cinema-video" loop muted playsinline id="cinema-video-element">
            <source src="4989.mp4" type="video/mp4">
        </video>
        <div class="cinema-overlay"></div>
        <div class="cinema-container">
            <div class="cinema-text-box">
                <p>長野県は星空の観察に適しています。</p>
                <p style="margin-top: 30px;">阿智村・野辺山、そして大町市が</p>
                <p><span class="love-highlight">愛</span>を込めてあなたを</p>
                <p>宇宙の旅へお連れします。</p>
            </div>
        </div>
        <a href="#" id="cinema-to-top" class="to-top" style="z-index: 2005; pointer-events: none; opacity: 0; bottom: 20px; right: 20px;">
            <span class="star-icon">✦</span>
            <span class="to-top-text">ホームへ戻る</span>
        </a>
        <a href="#" id="btn-cinema-close" class="btn-home-back">
            <span>✦</span> ホームへ戻る
        </a>
    </div>


    <script>
        const header = document.getElementById('main-header');
        const toTopBtn = document.getElementById('to-top');
        const cinemaToTopBtn = document.getElementById('cinema-to-top');
        
        const btnLaunch = document.getElementById('btn-launch');
        const cinemaLayer = document.getElementById('cinema-layer');
        const btnCinemaClose = document.getElementById('btn-cinema-close');
        const cinemaVideo = document.getElementById('cinema-video-element');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }

            if (!cinemaLayer.classList.contains('active') && window.scrollY > 300) {
                toTopBtn.classList.add('visible');
            } else {
                toTopBtn.classList.remove('visible');
            }
        });

        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));

        const sections = document.querySelectorAll('div[id], section[id]');
        const navLinks = document.querySelectorAll('.nav-link');
        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (pageYOffset >= sectionTop - 100) {
                    current = section.getAttribute('id');
                }
            });
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').includes(current)) {
                    link.classList.add('active');
                }
            });
        });

        btnLaunch.addEventListener('click', (e) => {
            e.preventDefault();
            document.body.classList.add('no-scroll');
            cinemaLayer.classList.add('active');
            cinemaVideo.currentTime = 0;
            cinemaVideo.play().catch(error => {
                console.log("Video playback failed:", error);
            });
            cinemaToTopBtn.classList.add('visible');
            cinemaToTopBtn.style.animation = 'fadeInTopButton 1s ease forwards 1s';
            cinemaToTopBtn.style.pointerEvents = 'auto';
        });

        btnCinemaClose.addEventListener('click', (e) => {
            e.preventDefault();
            cinemaLayer.classList.remove('active');
            document.body.classList.remove('no-scroll');
            cinemaVideo.pause();
            cinemaToTopBtn.classList.remove('visible');
            cinemaToTopBtn.style.animation = 'none';
            cinemaToTopBtn.style.pointerEvents = 'none';
            
            const textBox = cinemaLayer.querySelector('.cinema-text-box');
            const newTextBox = textBox.cloneNode(true);
            textBox.parentNode.replaceChild(newTextBox, textBox);
        });
    </script>
</body>
</html>
