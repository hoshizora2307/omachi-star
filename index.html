<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大町温泉郷 星空観賞会 ～銀河の旅人～</title>
    <style>
        :root {
            --bg-overlay: rgba(6, 10, 23, 0.75);
            --text-main: #f0f8ff;
            --accent-gold: #e6c27a;
            --accent-glow: rgba(230, 194, 122, 0.4);
            --card-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            background-color: #060a17;
            overflow-x: hidden;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, transparent 20%, var(--bg-overlay) 80%);
            z-index: -1;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            z-index: 1000;
            transition: all 0.4s ease;
        }

        header.scrolled {
            height: 65px;
            background: rgba(6, 10, 23, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(230, 194, 122, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            color: var(--accent-gold);
            font-size: 1.8rem;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-text span {
            color: var(--accent-gold);
            font-size: 0.85rem;
            display: block;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 35px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            position: relative;
            padding: 5px 0;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: width 0.3s;
        }
        nav a:hover::after, nav a.active::after {
            width: 100%;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #bbb;
            animation: fadeIn 2s ease-out;
        }

        .hero h1 {
            font-size: 4rem;
            margin: 20px 0 30px 0;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(255,255,255,0.2);
            animation: fadeIn 2.5s ease-out;
        }

        .launch-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-gold);
            letter-spacing: 6px;
            text-shadow: 0 0 10px var(--accent-glow);
            animation: fadeIn 3s ease-out;
            border: 1px solid var(--accent-gold);
            padding: 10px 30px;
            background: rgba(6, 10, 23, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 4px;
        }

        .scroll-down {
            position: absolute;
            bottom: 40px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: bounce 2s infinite;
        }

        .sec-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 50px;
            color: var(--accent-gold);
            letter-spacing: 4px;
            position: relative;
        }

        .partner-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .partner-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .partner-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        footer {
            text-align: center;
            padding: 40px;
            background: rgba(6, 10, 23, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            color: #718096;
            letter-spacing: 1px;
            margin-top: 100px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; text-shadow: 0 0 15px var(--accent-gold); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }

        @media (max-width: 768px) {
            header { padding: 0 20px; height: 65px; }
            .logo { font-size: 1.1rem; gap: 8px; }
            .logo-icon { font-size: 1.4rem; }
            .logo-text span { font-size: 0.75rem; letter-spacing: 1px; }
            nav ul { gap: 15px; }
            nav a { font-size: 0.85rem; }
            
            .container { padding: 60px 15px; }
            .hero h1 { font-size: 2.5rem; letter-spacing: 4px; word-break: keep-all; overflow-wrap: anywhere; margin: 15px 0 25px 0; }
            .hero p { font-size: 1rem; letter-spacing: 2px; padding: 0 10px; }
            .launch-text { font-size: 1.3rem; letter-spacing: 4px; padding: 8px 20px; }
            .sec-title { font-size: 1.8rem; margin-bottom: 30px; }
            
            .partner-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .partner-card { padding: 15px 10px; min-height: 75px; font-size: 0.9rem; }
        }

        @media (max-width: 480px) {
            .partner-grid { grid-template-columns: 1fr; }
            nav ul { gap: 10px; }
            nav a { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop muted playsinline>
        <source src="5963.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <header id="main-header">
        <a href="#" class="logo">
            <div class="logo-icon">✦</div>
            <div class="logo-text">
                <span>大町温泉郷</span>
                星空観賞会
            </div>
        </a>
        <nav>
            <ul>
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#partners" class="nav-link">Partners</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">
        <div id="home" class="hero">
            <p>星空案内ツアーガイド最高峰の体験</p>
            <h1>銀河の旅人</h1>
            <div class="launch-text">2026年8月始動</div>
            <a href="#partners" class="scroll-down">
                <span>Partners</span>
                <span>↓</span>
            </a>
        </div>

        <div class="container">
            <section id="partners" class="fade-in-up">
                <h2 class="sec-title">PARTNERS</h2>
                <div class="partner-grid">
                    <div class="partner-card">緑翠亭 景水</div>
                    <div class="partner-card">薬師の湯</div>
                    <div class="partner-card">ねるだけ</div>
                    <div class="partner-card">大町温泉郷観光協会</div>
                </div>
            </section>
        </div>

        <footer>
            &copy; 株式会社MONDOCOLO. All rights reserved.
        </footer>
    </div>

    <script>
        const header = document.getElementById('main-header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));

        const sections = document.querySelectorAll('div[id], section[id]');
        const navLinks = document.querySelectorAll('.nav-link');
        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (pageYOffset >= sectionTop - 100) {
                    current = section.getAttribute('id');
                }
            });
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').includes(current)) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
