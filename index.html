<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大町温泉郷 星空観賞会 ～銀河の旅人～</title>
    <style>
        :root {
            --bg-overlay: rgba(6, 10, 23, 0.75);
            --text-main: #f0f8ff;
            --accent-gold: #e6c27a;
            --accent-glow: rgba(230, 194, 122, 0.4);
            --card-bg: rgba(15, 23, 42, 0.6);
            --input-bg: rgba(5, 10, 25, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            background-color: #060a17;
            overflow-x: hidden;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, transparent 20%, var(--bg-overlay) 80%);
            z-index: -1;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            z-index: 1000;
            transition: all 0.4s ease;
        }

        header.scrolled {
            height: 65px;
            background: rgba(6, 10, 23, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(230, 194, 122, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            color: var(--accent-gold);
            font-size: 1.8rem;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-text span {
            color: var(--accent-gold);
            font-size: 0.85rem;
            display: block;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 35px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            position: relative;
            padding: 5px 0;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: width 0.3s;
        }
        nav a:hover::after, nav a.active::after {
            width: 100%;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #bbb;
            animation: fadeIn 2s ease-out;
        }

        .hero h1 {
            font-size: 4rem;
            margin: 25px 0;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(255,255,255,0.2);
            animation: fadeIn 2.5s ease-out;
        }

        .scroll-down {
            position: absolute;
            bottom: 40px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: bounce 2s infinite;
        }

        .sec-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 50px;
            color: var(--accent-gold);
            letter-spacing: 4px;
            position: relative;
        }

        .forum-board {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .post-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .post-list::-webkit-scrollbar { width: 6px; }
        .post-list::-webkit-scrollbar-thumb { background: rgba(230, 194, 122, 0.3); border-radius: 3px; }

        .post {
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 25px 0;
            display: flex;
            gap: 25px;
            animation: fadeIn 0.5s ease-in-out;
        }
        .post:last-child { border-bottom: none; }

        .user-info {
            width: 130px;
            flex-shrink: 0;
            text-align: center;
        }

        .avatar {
            width: 65px;
            height: 65px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.7rem;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .badge.meister { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; }
        .badge.traveler { background: linear-gradient(135deg, #70a1ff, #1e90ff); color: #fff; }
        .badge.watcher { background: #2f3542; color: #ced6e0; border: 1px solid rgba(255,255,255,0.2); }

        .post-content h4 {
            margin-bottom: 8px;
            font-size: 1.15rem;
            color: #fff;
        }
        .post-content p { color: #cbd5e1; font-size: 0.95rem; }

        .forum-input-area {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px dashed rgba(255,255,255,0.1);
        }
        .forum-flex {
            display: flex;
            gap: 15px;
        }
        .forum-flex input { width: 250px; }
        .forum-flex textarea { flex-grow: 1; resize: none; }

        .form-wrapper {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--accent-gold);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: var(--input-bg);
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e6c27a, #bfa365);
            color: #060a17;
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--accent-gold);
            background: #fff;
            color: #000;
        }

        footer {
            text-align: center;
            padding: 40px;
            background: rgba(6, 10, 23, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            color: #718096;
            letter-spacing: 1px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; text-shadow: 0 0 15px var(--accent-gold); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }

        @media (max-width: 768px) {
            header { padding: 0 20px; }
            nav ul { gap: 15px; }
            .hero h1 { font-size: 2.5rem; }
            .forum-flex { flex-direction: column; }
            .forum-flex input { width: 100%; }
            .form-wrapper { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop muted playsinline>
        <source src="5963.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <header id="main-header">
        <a href="#" class="logo">
            <div class="logo-icon">✦</div>
            <div class="logo-text">
                <span>大町温泉郷</span>
                星空観賞会
            </div>
        </a>
        <nav>
            <ul>
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#forum" class="nav-link">Forum</a></li>
                <li><a href="#reserve" class="nav-link">Reserve</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">
        <div id="home" class="hero">
            <p>星空案内ツアーガイド最高峰の体験</p>
            <h1>銀河の旅人</h1>
            <a href="#forum" class="scroll-down">
                <span>Explore</span>
                <span>↓</span>
            </a>
        </div>

        <div class="container">
            <section id="forum" class="fade-in-up">
                <h2 class="sec-title">STARGAZERS FORUM</h2>
                
                <div class="forum-board">
                    <div class="post-list" id="post-list">
                        <div class="post">
                            <div class="user-info">
                                <div class="avatar">👨‍🚀</div>
                                <div class="user-name">Kenji</div>
                                <div class="badge meister">マイスター</div>
                            </div>
                            <div class="post-content">
                                <h4>先日の観賞会での天の川について</h4>
                                <p>大町温泉郷の澄んだ空気のおかげで、先週の土曜日は素晴らしい天の川のコアが確認できました。次回参加される方は、ぜひ双眼鏡をお持ちいただくことをおすすめします。星雲のディテールまで楽しめますよ。</p>
                            </div>
                        </div>
                        <div class="post-content" style="display:none;"></div>
                    </div>

                    <div class="forum-input-area">
                        <div class="forum-flex">
                            <input type="text" id="forum-name" class="form-control" placeholder="ニックネーム" required>
                            <select id="forum-badge" class="form-control" style="width:180px;">
                                <option value="watcher">夜空を見上げる者</option>
                                <option value="traveler">銀河の旅人</option>
                                <option value="meister">マイスター</option>
                            </select>
                        </div>
                        <div class="forum-flex" style="margin-top:10px;">
                            <textarea id="forum-msg" class="form-control" rows="2" placeholder="コメントを入力..."></textarea>
                            <button type="button" id="btn-post" class="btn-submit" style="width:120px; margin:0; font-size:1rem; padding:0 10px;">投稿</button>
                        </div>
                    </div>

                </div>
            </section>
        </div>

        <div class="container">
            <section id="reserve" class="fade-in-up">
                <h2 class="sec-title">RESERVATION</h2>
                <div class="form-wrapper">
                    <form id="booking-form" onsubmit="handleReserve(event)">
                        <div class="form-group">
                            <label for="name">お名前</label>
                            <input type="text" id="name" class="form-control" placeholder="例：星空 太郎" required>
                        </div>
                        <div class="form-group">
                            <label for="email">メールアドレス</label>
                            <input type="email" id="email" class="form-control" placeholder="example@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="date">ご希望の参加日</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="people">参加人数</label>
                            <select id="people" class="form-control">
                                <option value="1">1名</option>
                                <option value="2">2名</option>
                                <option value="3">3名</option>
                                <option value="4">4名以上</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-submit">予約を確定する</button>
                    </form>
                </div>
            </section>
        </div>

        <footer>
            &copy; 株式会社MONDOCOLO. All rights reserved.
        </footer>
    </div>

    <script>
        const header = document.getElementById('main-header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));

        const sections = document.querySelectorAll('div[id], section[id]');
        const navLinks = document.querySelectorAll('.nav-link');
        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (pageYOffset >= sectionTop - 100) {
                    current = section.getAttribute('id');
                }
            });
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').includes(current)) {
                    link.classList.add('active');
                }
            });
        });

        document.getElementById('btn-post').addEventListener('click', () => {
            const nameInput = document.getElementById('forum-name');
            const msgInput = document.getElementById('forum-msg');
            const badgeSelect = document.getElementById('forum-badge');

            if (!nameInput.value || !msgInput.value) {
                return;
            }

            const newPost = document.createElement('div');
            newPost.classList.add('post');
            
            let badgeLabel = '夜空を見上げる者';
            if(badgeSelect.value === 'meister') badgeLabel = 'マイスター';
            if(badgeSelect.value === 'traveler') badgeLabel = '銀河の旅人';

            newPost.innerHTML = `
                <div class="user-info">
                    <div class="avatar">✨</div>
                    <div class="user-name">${escapeHTML(nameInput.value)}</div>
                    <div class="badge ${badgeSelect.value}">${badgeLabel}</div>
                </div>
                <div class="post-content">
                    <h4>${escapeHTML(nameInput.value)}</h4>
                    <p>${escapeHTML(msgInput.value)}</p>
                </div>
            `;

            const postList = document.getElementById('post-list');
            postList.insertBefore(newPost, postList.firstChild);

            msgInput.value = '';
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function handleReserve(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            alert(`受付完了\n\n${name} 様\nお申込みを承りました。折り返し担当者よりご連絡いたします。`);
            document.getElementById('booking-form').reset();
        }
    </script>
</body>
</html>
