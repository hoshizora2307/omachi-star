<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プリン星団を守れ！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #gameCanvas { display: block; width: 100vw; height: 100vh; }

  /* ===== UI OVERLAY ===== */
  #ui {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #hud {
    position: absolute; top: 16px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 24px;
  }
  .hud-box {
    background: rgba(10,6,30,0.72);
    border: 1.5px solid rgba(255,220,80,0.35);
    border-radius: 10px;
    padding: 6px 18px;
    color: #ffe87a;
    font-size: 1rem;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,220,80,0.5);
  }
  .hud-box span { font-size: 1.3rem; font-weight: bold; }
  #livesRow { display: flex; gap: 6px; align-items: center; }
  .heart { font-size: 1.4rem; }

  /* ===== SCREENS ===== */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 60%, #0a0620 0%, #000 100%);
    z-index: 20;
    pointer-events: all;
  }
  .screen.hidden { display: none; }

  .game-title {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 30px #ffd700, 0 0 60px #ff8c00;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }
  .sub-title {
    font-size: 1rem; color: #aaa;
    letter-spacing: 3px; margin-bottom: 32px;
  }
  .player-img-lg {
    width: 120px; height: 120px;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 24px rgba(255,200,50,0.8));
    animation: floatBig 2.4s ease-in-out infinite;
    margin-bottom: 24px;
  }
  @keyframes floatBig {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-18px) rotate(4deg); }
  }
  .btn {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a0a00; font-weight: 900;
    border: none; border-radius: 50px;
    padding: 14px 52px; font-size: 1.15rem;
    cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(255,200,50,0.6);
    transition: transform 0.15s, box-shadow 0.15s;
    margin: 8px;
    pointer-events: all;
  }
  .btn:hover { transform: scale(1.08); box-shadow: 0 0 50px rgba(255,200,50,0.9); }
  .btn-secondary {
    background: transparent;
    border: 2px solid rgba(255,220,80,0.5);
    color: #ffe87a; border-radius: 50px;
    padding: 10px 36px; font-size: 0.95rem;
    cursor: pointer; letter-spacing: 2px;
    transition: all 0.15s; margin: 6px;
    pointer-events: all;
  }
  .btn-secondary:hover { background: rgba(255,220,80,0.1); border-color: #ffd700; }

  /* Ranking panel */
  #rankPanel {
    background: rgba(10,6,30,0.95);
    border: 1.5px solid rgba(255,220,80,0.4);
    border-radius: 16px;
    padding: 24px 32px;
    min-width: 340px; max-width: 480px;
    width: 90%;
    margin: 16px 0;
    max-height: 55vh;
    overflow-y: auto;
  }
  .rank-title {
    color: #ffd700; font-size: 1.1rem; font-weight: bold;
    text-align: center; margin-bottom: 14px; letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(255,200,50,0.6);
  }
  .rank-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    color: #eee; font-size: 0.95rem;
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { color: #ffd700; font-weight: bold; min-width: 28px; }
  .rank-num.gold   { color: #FFD700; text-shadow: 0 0 8px #FFD700; font-size: 1.1rem; }
  .rank-num.silver { color: #C0C0C0; }
  .rank-num.bronze { color: #CD7F32; }
  .rank-name { flex: 1; padding: 0 10px; }
  .rank-score { color: #ffe87a; font-weight: bold; }
  .rank-empty { color: #555; text-align: center; padding: 20px 0; }

  /* Game Over / Name Entry */
  .go-score { font-size: 2.5rem; color: #ffd700; font-weight: 900;
    text-shadow: 0 0 30px #ffd700; margin: 12px 0; }
  .name-input {
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,220,80,0.5);
    border-radius: 10px;
    color: #fff; font-size: 1.2rem;
    padding: 10px 20px;
    text-align: center; width: 280px;
    outline: none; margin: 10px 0;
    letter-spacing: 2px;
  }
  .name-input:focus { border-color: #ffd700; }
  .name-hint { color: #888; font-size: 0.8rem; margin-bottom: 8px; }

  /* Controls hint */
  #controlsHint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35); font-size: 0.75rem; letter-spacing: 1px;
    z-index: 11; pointer-events: none;
  }

  /* Level banner */
  #levelBanner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 2.8rem; font-weight: 900;
    color: #fff; text-shadow: 0 0 40px #ffd700, 0 0 80px #ff8c00;
    z-index: 15; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }

  /* Stars bg canvas */
  #bgCanvas {
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* Loading */
  #loadingMsg {
    color: #ffe87a; font-size: 1.1rem; letter-spacing: 2px; margin-top: 10px;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Mobile touch buttons */
  #touchControls {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 10px 20px 24px;
    z-index: 12; pointer-events: all;
  }
  .touch-btn {
    background: rgba(255,220,80,0.18);
    border: 2px solid rgba(255,220,80,0.4);
    border-radius: 50%; width: 64px; height: 64px;
    color: #ffd700; font-size: 1.4rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
  }
  .touch-center { display: flex; gap: 12px; }
  @media (max-width: 768px) {
    #touchControls { display: flex; }
  }

  /* Explosion particles */
  .explosion {
    position: fixed; pointer-events: none; z-index: 8;
    font-size: 1.8rem; animation: explode 0.6s forwards;
  }
  @keyframes explode {
    0%   { opacity: 1; transform: scale(0.5) rotate(0deg); }
    60%  { opacity: 1; transform: scale(1.4) rotate(180deg); }
    100% { opacity: 0; transform: scale(2) rotate(360deg); }
  }
</style>
</head>
<body>

<!-- Background starfield -->
<canvas id="bgCanvas"></canvas>

<!-- Three.js Game Canvas -->
<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="ui">
  <div id="hud">
    <div class="hud-box">スコア <span id="scoreVal">0</span></div>
    <div class="hud-box" style="font-size:0.85rem;">
      LEVEL <span id="levelVal">1</span>
    </div>
    <div class="hud-box">
      <div id="livesRow"></div>
    </div>
  </div>
</div>

<div id="levelBanner">LEVEL UP!</div>
<div id="controlsHint">← → 移動 &nbsp;|&nbsp; スペース/上 発射 &nbsp;|&nbsp; モバイル: 下のボタン</div>

<!-- Touch controls for mobile -->
<div id="touchControls">
  <div class="touch-btn" id="tleft" ontouchstart="touchState.left=true" ontouchend="touchState.left=false">◀</div>
  <div class="touch-center">
    <div class="touch-btn" id="tshoot" ontouchstart="touchState.shoot=true" ontouchend="touchState.shoot=false">💥</div>
  </div>
  <div class="touch-btn" id="tright" ontouchstart="touchState.right=true" ontouchend="touchState.right=false">▶</div>
</div>

<!-- ===== TITLE SCREEN ===== -->
<div class="screen" id="titleScreen">
  <img src="star_3_sparkle.png" class="player-img-lg" alt="プリンAスター">
  <div class="game-title">プリン星団を守れ！</div>
  <div class="sub-title">プリン星団からやってきたプリンAスター</div>
  <button class="btn" onclick="startGame()">ゲームスタート</button>
  <button class="btn-secondary" onclick="showRanking()">🏆 ランキング</button>

  <div id="rankPanel" style="margin-top:20px;">
    <div class="rank-title">🏆 TOP 10 ランキング</div>
    <div id="rankListTitle"><div class="rank-empty">読み込み中...</div></div>
  </div>
</div>

<!-- ===== RANKING SCREEN ===== -->
<div class="screen hidden" id="rankingScreen">
  <div class="game-title" style="font-size:2rem;">🏆 ランキング</div>
  <div id="rankPanel" style="margin-top:16px;">
    <div class="rank-title">TOP 10</div>
    <div id="rankListFull"><div class="rank-empty">読み込み中...</div></div>
  </div>
  <button class="btn-secondary" onclick="hideRanking()" style="margin-top:16px;">← 戻る</button>
</div>

<!-- ===== GAME OVER SCREEN ===== -->
<div class="screen hidden" id="gameOverScreen">
  <div class="game-title" style="font-size:2rem; color:#ff6b6b; text-shadow:0 0 30px #ff0000;">GAME OVER</div>
  <div style="color:#aaa; margin:6px 0 2px; letter-spacing:2px;">YOUR SCORE</div>
  <div class="go-score" id="finalScore">0</div>

  <div id="nameEntryArea">
    <div style="color:#ffe87a; margin-bottom:8px; font-size:1rem;">名前を入力してランキングに登録！</div>
    <div class="name-hint">最大8文字</div>
    <input class="name-input" id="playerNameInput" type="text" maxlength="8" placeholder="プレイヤー名" autocomplete="off">
    <br>
    <button class="btn" id="submitBtn" onclick="submitScore()">登録して終了</button>
    <button class="btn-secondary" onclick="skipSubmit()">登録せずに終了</button>
    <div id="submitMsg" style="color:#ffe87a; margin-top:8px; min-height:24px;"></div>
  </div>

  <div id="rankPanel" style="margin-top:12px;">
    <div class="rank-title">🏆 TOP 10</div>
    <div id="rankListGO"><div class="rank-empty">読み込み中...</div></div>
  </div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// ============================================================
//  STORAGE – Anthropic API (shared=true)
// ============================================================
const STORAGE_KEY = "purin_ranking_v1";

async function loadRanking() {
  try {
    const res = await window.storage.get(STORAGE_KEY, true);
    if (!res) return [];
    return JSON.parse(res.value);
  } catch(e) { return []; }
}

async function saveRanking(list) {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(list), true);
  } catch(e) { console.error('save fail', e); }
}

async function addScore(name, pts) {
  let list = await loadRanking();
  list.push({ name: name.trim() || '匿名スター', score: pts, date: new Date().toLocaleDateString('ja-JP') });
  list.sort((a,b) => b.score - a.score);
  list = list.slice(0, 10);
  await saveRanking(list);
  return list;
}

// ============================================================
//  RANKING UI
// ============================================================
function medal(rank) {
  if (rank === 0) return '<span class="rank-num gold">🥇</span>';
  if (rank === 1) return '<span class="rank-num silver">🥈</span>';
  if (rank === 2) return '<span class="rank-num bronze">🥉</span>';
  return `<span class="rank-num">${rank+1}</span>`;
}
function renderRanking(list, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="rank-empty">まだ記録がありません。<br>あなたが1位に！</div>';
    return;
  }
  el.innerHTML = list.map((r, i) => `
    <div class="rank-row">
      ${medal(i)}
      <span class="rank-name">${escHtml(r.name)}</span>
      <span class="rank-score">${r.score.toLocaleString()}</span>
    </div>`).join('');
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function refreshRanking() {
  const list = await loadRanking();
  renderRanking(list, 'rankListTitle');
  renderRanking(list, 'rankListFull');
  renderRanking(list, 'rankListGO');
}

// ============================================================
//  SCREEN MANAGEMENT
// ============================================================
function showScreen(id) {
  ['titleScreen','rankingScreen','gameOverScreen'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}
function showRanking() {
  showScreen('rankingScreen');
  refreshRanking();
}
function hideRanking() { showScreen('titleScreen'); }

// ============================================================
//  BACKGROUND STARFIELD (2D canvas)
// ============================================================
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let bgStars = [];
function initBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  bgStars = Array.from({length: 200}, () => ({
    x: Math.random() * bgCanvas.width,
    y: Math.random() * bgCanvas.height,
    r: Math.random() * 1.5 + 0.3,
    s: Math.random() * 0.3 + 0.1,
    a: Math.random()
  }));
}
function drawBg(t) {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  bgCtx.fillStyle = '#000';
  bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  for (const star of bgStars) {
    star.a = 0.4 + 0.6 * (Math.sin(t * star.s + star.x) * 0.5 + 0.5);
    bgCtx.beginPath();
    bgCtx.arc(star.x, star.y, star.r, 0, Math.PI*2);
    bgCtx.fillStyle = `rgba(255,255,240,${star.a})`;
    bgCtx.fill();
  }
}

// ============================================================
//  THREE.JS SETUP
// ============================================================
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const W = () => window.innerWidth;
const H = () => window.innerHeight;

// Orthographic camera – game is 2D layout in 3D world
let camera = new THREE.OrthographicCamera(-W()/2, W()/2, H()/2, -H()/2, 0.1, 2000);
camera.position.z = 500;

function resize() {
  renderer.setSize(W(), H());
  camera.left = -W()/2; camera.right = W()/2;
  camera.top = H()/2; camera.bottom = -H()/2;
  camera.updateProjectionMatrix();
  initBg();
}
window.addEventListener('resize', resize);
resize();

// Lighting
const ambLight = new THREE.AmbientLight(0x8888cc, 0.8);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(1, 2, 3);
scene.add(dirLight);
const pointLight = new THREE.PointLight(0x4488ff, 1.5, 600);
pointLight.position.set(0, 0, 200);
scene.add(pointLight);

// ============================================================
//  PLAYER (sprite)
// ============================================================
const starTexture = new THREE.TextureLoader().load('data:image/png;base64,' + STAR_B64);
let player, playerSprite;

function createPlayer() {
  if (player) scene.remove(player);
  const mat = new THREE.SpriteMaterial({ map: starTexture, transparent: true });
  playerSprite = new THREE.Sprite(mat);
  playerSprite.scale.set(70, 70, 1);
  playerSprite.position.set(0, -H()/2 + 80, 1);
  scene.add(playerSprite);
  player = playerSprite;
}

// ============================================================
//  BULLETS
// ============================================================
const bullets = [];
const bulletGeo = new THREE.CylinderGeometry(3, 1.5, 18, 8);

function shoot() {
  if (frameCount - lastShotFrame < 10) return;
  lastShotFrame = frameCount;

  const mat = new THREE.MeshStandardMaterial({
    color: 0xffee33,
    emissive: 0xffaa00,
    emissiveIntensity: 2,
    metalness: 0.5,
    roughness: 0.1
  });
  const mesh = new THREE.Mesh(bulletGeo, mat);
  mesh.position.set(player.position.x, player.position.y + 40, 0);
  mesh.rotation.x = Math.PI/2;
  scene.add(mesh);
  bullets.push({ mesh, vy: 14 + level * 0.5 });
}

function updateBullets() {
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.y += b.vy;
    b.mesh.rotation.z += 0.2;
    if (b.mesh.position.y > H()/2 + 30) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }
}

// ============================================================
//  ENEMIES – 3D Polygonal
// ============================================================
const enemies = [];

const ENEMY_TYPES = [
  // [geo, color, emissive, size, hp, score, speed]
  { geo: () => new THREE.TetrahedronGeometry(1, 0),      color: 0xff2244, em: 0x880011, size:28, hp:1, pts:100, speed:1.8 },
  { geo: () => new THREE.OctahedronGeometry(1, 0),       color: 0xff6600, em: 0x882200, size:36, hp:2, pts:200, speed:1.4 },
  { geo: () => new THREE.IcosahedronGeometry(1, 0),      color: 0x8800ff, em: 0x440088, size:44, hp:3, pts:350, speed:1.1 },
  { geo: () => new THREE.BoxGeometry(1,1,1),              color: 0x00aaff, em: 0x004488, size:34, hp:2, pts:250, speed:1.5 },
  { geo: () => new THREE.CylinderGeometry(0,1,1.6,6),    color: 0xff0088, em: 0x880033, size:50, hp:4, pts:500, speed:0.9 },
  { geo: () => new THREE.SphereGeometry(1, 6, 6),        color: 0x00ff88, em: 0x008844, size:52, hp:5, pts:700, speed:0.7 },
  { geo: () => new THREE.TorusGeometry(1, 0.4, 6, 8),   color: 0xffcc00, em: 0x886600, size:58, hp:6, pts:900, speed:0.65 },
];

function spawnEnemy() {
  const typePool = ENEMY_TYPES.slice(0, Math.min(2 + Math.floor(level/1.5), ENEMY_TYPES.length));
  const t = typePool[Math.floor(Math.random() * typePool.length)];
  const s = t.size * (0.7 + Math.random() * 0.9);

  const geo = t.geo();
  const mat = new THREE.MeshStandardMaterial({
    color: t.color,
    emissive: t.em,
    emissiveIntensity: 1.2,
    metalness: 0.7,
    roughness: 0.2,
    wireframe: Math.random() < 0.15
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(s, s, s);
  mesh.position.set(
    (Math.random() - 0.5) * (W() - 80),
    H()/2 + s + 10,
    Math.random() * 60 - 30
  );

  // Random sinusoidal drift
  const drift = (Math.random() - 0.5) * 2.5;
  const driftFreq = 0.02 + Math.random() * 0.03;
  const spd = (t.speed + level * 0.15) * (0.8 + Math.random() * 0.4);

  scene.add(mesh);
  enemies.push({ mesh, vy: -spd, drift, driftFreq, hp: t.hp, maxHp: t.hp, pts: t.pts, size: s, rx:Math.random()*0.06-0.03, ry:Math.random()*0.06-0.03 });
}

function updateEnemies() {
  const interval = Math.max(30, 90 - level * 6);
  if (frameCount - lastEnemyFrame > interval) {
    spawnEnemy();
    if (level > 3 && Math.random() < 0.3) spawnEnemy();
    lastEnemyFrame = frameCount;
  }

  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    e.mesh.position.y += e.vy;
    e.mesh.position.x += Math.sin(frameCount * e.driftFreq) * e.drift;
    e.mesh.rotation.x += e.rx;
    e.mesh.rotation.y += e.ry;

    if (e.mesh.position.y < -H()/2 - e.size - 10) {
      scene.remove(e.mesh);
      enemies.splice(i, 1);
    }
  }
}

// ============================================================
//  COLLISION DETECTION
// ============================================================
function checkCollisions() {
  for (let bi = bullets.length-1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length-1; ei >= 0; ei--) {
      const e = enemies[ei];
      const dx = b.mesh.position.x - e.mesh.position.x;
      const dy = b.mesh.position.y - e.mesh.position.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < e.size * 0.85) {
        // Hit!
        scene.remove(b.mesh);
        bullets.splice(bi, 1);
        e.hp--;
        // Flash
        e.mesh.material.emissiveIntensity = 4;
        setTimeout(() => { if (e.mesh.material) e.mesh.material.emissiveIntensity = 1.2; }, 80);

        if (e.hp <= 0) {
          spawnExplosion(e.mesh.position.x, e.mesh.position.y);
          addScore2(e.pts * scoreMultiplier);
          scene.remove(e.mesh);
          enemies.splice(ei, 1);
        }
        break;
      }
    }
  }

  // Player-enemy collision
  if (!player) return;
  for (let ei = enemies.length-1; ei >= 0; ei--) {
    const e = enemies[ei];
    const dx = player.position.x - e.mesh.position.x;
    const dy = player.position.y - e.mesh.position.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < e.size * 0.7 + 22) {
      scene.remove(e.mesh);
      enemies.splice(ei, 1);
      spawnExplosion(player.position.x, player.position.y, '💥');
      playerHit();
    }
  }
}

// ============================================================
//  EXPLOSION (DOM emoji burst)
// ============================================================
function spawnExplosion(worldX, worldY, emoji) {
  const emojis = emoji ? [emoji] : ['✨','💫','⭐','🌟'];
  for (let i = 0; i < 3; i++) {
    const el = document.createElement('div');
    el.className = 'explosion';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    // Convert world coords to screen
    const sx = worldX + W()/2;
    const sy = H()/2 - worldY;
    el.style.left = (sx + (Math.random()-0.5)*40) + 'px';
    el.style.top  = (sy + (Math.random()-0.5)*40) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }
}

// ============================================================
//  SCORE / LIVES / LEVEL
// ============================================================
function addScore2(pts) {
  score += pts;
  document.getElementById('scoreVal').textContent = score.toLocaleString();
  // Level up every 3000 pts (scaled)
  const newLevel = Math.floor(score / 3000) + 1;
  if (newLevel > level) {
    level = newLevel;
    scoreMultiplier = 1 + (level-1) * 0.2;
    document.getElementById('levelVal').textContent = level;
    showLevelBanner();
  }
}

function showLevelBanner() {
  const b = document.getElementById('levelBanner');
  b.textContent = `LEVEL ${level}!`;
  b.style.opacity = 1;
  setTimeout(() => { b.style.opacity = 0; }, 1200);
}

function updateLivesUI() {
  const row = document.getElementById('livesRow');
  row.innerHTML = '';
  for (let i = 0; i < lives; i++) {
    const h = document.createElement('span');
    h.className = 'heart'; h.textContent = '⭐';
    row.appendChild(h);
  }
}

function playerHit() {
  lives--;
  updateLivesUI();
  // Flash red
  if (player) {
    player.material.color.set(0xff0000);
    setTimeout(() => { if (player) player.material.color.set(0xffffff); }, 300);
  }
  if (lives <= 0) triggerGameOver();
}

// ============================================================
//  GAME LOOP
// ============================================================
const PLAYER_SPEED = 6;

function gameLoop(t) {
  animId = requestAnimationFrame(gameLoop);
  frameCount++;

  drawBg(t * 0.001);

  if (gameState !== 'playing') {
    renderer.render(scene, camera);
    return;
  }

  // Player movement
  if (player) {
    const spd = PLAYER_SPEED + level * 0.2;
    if ((keys['ArrowLeft'] || keys['a'] || touchState.left) && player.position.x > -W()/2 + 40)
      player.position.x -= spd;
    if ((keys['ArrowRight'] || keys['d'] || touchState.right) && player.position.x < W()/2 - 40)
      player.position.x += spd;
    if (keys['ArrowUp'] || keys[' '] || touchState.shoot)
      shoot();

    // Tilt based on movement
    player.material.rotation = ((keys['ArrowLeft']||touchState.left) ? -0.25 : (keys['ArrowRight']||touchState.right) ? 0.25 : 0);
  }

  updateBullets();
  updateEnemies();
  checkCollisions();

  // Rotate all enemies
  renderer.render(scene, camera);
}

// ============================================================
//  GAME CONTROL
// ============================================================
function clearScene() {
  [...enemies].forEach(e => scene.remove(e.mesh));
  enemies.length = 0;
  [...bullets].forEach(b => scene.remove(b.mesh));
  bullets.length = 0;
}

function startGame() {
  showScreen(null); // hide all
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('rankingScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');

  score = 0; lives = 3; level = 1; frameCount = 0;
  lastShotFrame = 0; lastEnemyFrame = 0; scoreMultiplier = 1;
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('levelVal').textContent = '1';
  updateLivesUI();

  clearScene();
  createPlayer();
  gameState = 'playing';
}

async function triggerGameOver() {
  gameState = 'gameover';
  clearScene();
  if (player) { scene.remove(player); player = null; }

  document.getElementById('finalScore').textContent = score.toLocaleString();
  document.getElementById('playerNameInput').value = '';
  document.getElementById('submitMsg').textContent = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('nameEntryArea').style.display = 'block';

  await refreshRanking();
  showScreen('gameOverScreen');
}

async function submitScore() {
  const name = document.getElementById('playerNameInput').value.trim() || '匿名スター';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitMsg').textContent = '登録中...';
  try {
    const list = await addScore(name, score);
    renderRanking(list, 'rankListGO');
    document.getElementById('nameEntryArea').style.display = 'none';
    document.getElementById('submitMsg').textContent = '✅ 登録しました！';
    // Also refresh title screen list
    renderRanking(list, 'rankListTitle');
  } catch(e) {
    document.getElementById('submitMsg').textContent = '⚠️ 登録に失敗しました';
    document.getElementById('submitBtn').disabled = false;
  }
}

async function skipSubmit() {
  document.getElementById('nameEntryArea').style.display = 'none';
  await refreshRanking();
  setTimeout(() => {
    showScreen('titleScreen');
    refreshRanking();
  }, 400);
}

// ============================================================
//  INPUT
// ============================================================
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ============================================================
//  INIT
// ============================================================
initBg();
refreshRanking();
showScreen('titleScreen');
gameLoop(0);
</script>

</body>
