<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>プリン星団を守れ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: 'Klee One', serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas { display: block; position: fixed; inset: 0; z-index: 1; touch-action: none; }

  #ui {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #hud {
    position: absolute; top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 12px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .hud-box {
    background: rgba(10,6,30,0.72);
    border: 1.5px solid rgba(255,220,80,0.35);
    border-radius: 10px;
    padding: 4px 12px;
    color: #ffe87a;
    font-size: 1rem;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,220,80,0.5);
    white-space: nowrap;
  }
  .hud-box span { font-size: 1.3rem; font-weight: bold; }
  .hud-time { color: #64ffb4; border-color: rgba(100,255,180,0.35); }
  .hud-time span { color: #fff; text-shadow: 0 0 8px #64ffb4; }
  #livesRow { display: flex; gap: 4px; align-items: center; }
  .heart { font-size: 1.2rem; }

  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 60%, #0a0620 0%, #000 100%);
    z-index: 20;
    pointer-events: all;
  }
  .screen.hidden { display: none; }

  .game-title {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 30px #ffd700, 0 0 60px #ff8c00;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }
  .sub-title {
    font-size: 1.2rem; color: #aaa;
    letter-spacing: 3px; margin-bottom: 32px;
    text-align: center;
  }
  .player-img-lg {
    width: 120px; height: 120px;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 24px rgba(255,200,50,0.8));
    animation: floatBig 2.4s ease-in-out infinite;
    margin-bottom: 24px;
  }
  @keyframes floatBig {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-18px) rotate(4deg); }
  }
  .btn {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a0a00; font-weight: 900;
    border: none; border-radius: 50px;
    padding: 14px 52px; font-size: 1.3rem;
    cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(255,200,50,0.6);
    transition: transform 0.15s, box-shadow 0.15s;
    margin: 8px;
    pointer-events: all;
    font-family: 'Klee One', serif;
  }
  .btn:hover { transform: scale(1.08); box-shadow: 0 0 50px rgba(255,200,50,0.9); }
  .btn-secondary {
    background: transparent;
    border: 2px solid rgba(255,220,80,0.5);
    color: #ffe87a; border-radius: 50px;
    padding: 10px 36px; font-size: 1.1rem;
    cursor: pointer; letter-spacing: 2px;
    transition: all 0.15s; margin: 6px;
    pointer-events: all;
    font-family: 'Klee One', serif;
  }
  .btn-secondary:hover { background: rgba(255,220,80,0.1); border-color: #ffd700; }

  #rankPanel {
    background: rgba(10,6,30,0.95);
    border: 1.5px solid rgba(255,220,80,0.4);
    border-radius: 16px;
    padding: 24px 32px;
    min-width: 340px; max-width: 480px;
    width: 90%;
    margin: 16px 0;
    max-height: 50vh;
    overflow-y: auto;
  }
  .rank-title {
    color: #ffd700; font-size: 1.3rem; font-weight: bold;
    text-align: center; margin-bottom: 14px; letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(255,200,50,0.6);
  }
  .rank-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    color: #eee; font-size: 1.1rem;
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { color: #ffd700; font-weight: bold; min-width: 28px; }
  .rank-num.gold   { color: #FFD700; text-shadow: 0 0 8px #FFD700; font-size: 1.2rem; }
  .rank-num.silver { color: #C0C0C0; }
  .rank-num.bronze { color: #CD7F32; }
  .rank-name { flex: 1; padding: 0 10px; }
  .rank-score { color: #ffe87a; font-weight: bold; }
  .rank-empty { color: #555; text-align: center; padding: 20px 0; font-size: 1.1rem; }

  .go-score { font-size: 3rem; color: #ffd700; font-weight: 900;
    text-shadow: 0 0 30px #ffd700; margin: 12px 0; }
  .name-input {
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,220,80,0.5);
    border-radius: 10px;
    color: #fff; font-size: 1.4rem;
    padding: 10px 20px;
    text-align: center; width: 280px;
    outline: none; margin: 10px 0;
    letter-spacing: 2px;
    font-family: 'Klee One', serif;
  }
  .name-input:focus { border-color: #ffd700; }
  .name-hint { color: #888; font-size: 0.9rem; margin-bottom: 8px; }

  #controlsHint {
    position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.6); font-size: 1rem; letter-spacing: 1px;
    z-index: 11; pointer-events: none;
    text-align: center;
    width: 100%;
  }

  #levelBanner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 3.5rem; font-weight: 900;
    color: #fff; text-shadow: 0 0 40px #ffd700, 0 0 80px #ff8c00;
    z-index: 15; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
    text-align: center;
  }

  .item-overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 50; pointer-events: none;
    animation: overlayFade 2.2s forwards;
  }
  @keyframes overlayFade {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { opacity: 0; }
  }
  .item-popup {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(5,5,20,0.88);
    border-radius: 22px;
    padding: 24px 36px 20px;
    box-shadow: 0 0 60px rgba(255,255,255,0.15);
    animation: popupZoom 2.2s forwards;
  }
  @keyframes popupZoom {
    0%   { transform: scale(0.3) rotate(-25deg); }
    20%  { transform: scale(1.18) rotate(8deg); }
    35%  { transform: scale(0.97) rotate(-3deg); }
    50%  { transform: scale(1.04) rotate(1deg); }
    65%  { transform: scale(1) rotate(0deg); }
    85%  { transform: scale(1) rotate(0deg); }
    100% { transform: scale(0.7) rotate(15deg); }
  }
  .item-lemon { border: 2px solid rgba(255,230,80,0.7); }
  .item-mint  { border: 2px solid rgba(100,255,180,0.7); }

    height: 160px; width: auto;
    filter: drop-shadow(0
